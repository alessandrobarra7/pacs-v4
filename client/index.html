    <!-- Fontes do módulo Financeiro (identidade visual escopada a /financeiro/*) +
         Work Sans (pedido do Alessandro, 2026-10-13, branch
         claude/fonte-work-sans-legenda-exame): antes a legenda/nome do exame
         na listagem PACS (componente ExamName, PacsQueryPage.tsx) usava a
         fonte padrão do sistema operacional (Segoe UI no Windows), porque o
         sistema nunca teve nenhuma fonte customizada definida fora do
         Financeiro. O Alessandro comparou 5 opções (mockups com fontes reais
         embutidas) e escolheu Work Sans. Escopo confirmado por ele: só o
         texto da legenda/nome do exame, não o sistema inteiro — por isso o
         font-family só é aplicado via a classe .exam-legend-font (ver
         index.css), nunca no body/global. -->
